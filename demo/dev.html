<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <!-- #include virtual="/imports.html" -->
     <link rel="stylesheet" href="../default.css">
</head>

<body>
    <style>
        div{
            margin: 10px;
        }
    </style>
    <div>
        <label>
            <span>Select 1</span>
            <select id="select1" multiple>
                <option value="">-- Please choose an option --</option>
                <option selected value="option1">Option 1</option>
                <option value="option2">Option 2</option>
            </select>
        </label>
    </div>

    <div>
        <label>
            <span>Select 2</span>
            <select id="select2">
                <option value="">-- Please choose an option --</option>
                <option value="option3">Option 3</option>
                <option value="option4">Option 4</option>
            </select>
        </label>
    </div>

    <div id="div">
        <chip-away for="select1 select2"></chip-away>
    </div>
    

    <script type="module" src="../index.js"></script>
    <button onclick="removeTemp()">remove</button>

    <button onclick="addTemp()">add</button>

    <label><input type="checkbox" onchange="temp.join = this.checked"> join</label>

    <label><input type="checkbox" onchange="temp.readonly = this.checked"> readonly</label>

    <script>
        const temp = document.querySelector('chip-away');

        function removeTemp(){
            temp.remove();
            console.log(temp.isConnected);
        }

        function addTemp(){
            div.appendChild(temp);
        }
    </script>
</body>

</html>
