<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip Away - Deferred Select</title>
    <!--#include virtual="/imports.html" -->
    <link rel="stylesheet" href="../default.css">
</head>
<body>
    <!-- The <chip-away> element references a select that isn't in the DOM yet. -->
    <chip-away for="select1"></chip-away>

    <div id="host"></div>

    <script type="module">
        import '../index.js';

        // Inject the referenced <select> well after chip-away has connected.
        setTimeout(() => {
            document.getElementById('host').innerHTML = `
                <label>
                    <span>Select Options:</span>
                    <select id="select1" multiple>
                        <option selected value="option1">Option 1</option>
                        <option selected value="option2">Option 2</option>
                        <option value="option3">Option 3</option>
                    </select>
                </label>`;
        }, 300);

        function runTest(){
            // idRefs' MutationObserver should have picked up the late <select>
            // and driven a render: 2 chips, 1 fieldset.
            const chips = document.querySelectorAll('.chip');
            const fieldsets = document.querySelectorAll('fieldset');
            if(chips.length === 2 && fieldsets.length === 1){
                document.getElementById('target').setAttribute('mark', 'good');
            } else {
                document.getElementById('target').setAttribute('mark', 'bad');
            }
        }

        setTimeout(() => {
            runTest();
        }, 1000);
    </script>

    <div id="target"></div>
</body>
</html>
