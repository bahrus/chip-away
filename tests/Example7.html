<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip Away - Join (single summary chip)</title>
    <!--#include virtual="/imports.html" -->
    <link rel="stylesheet" href="../default.css">
</head>
<body>
    <label>
        <span>Select Options:</span>
        <select id="select1" multiple>
            <option selected value="option1">Option 1</option>
            <option selected value="option2">Option 2</option>
            <option selected value="option3">Option 3</option>
        </select>
    </label>

    <chip-away for="select1" join></chip-away>

    <script type="module">
        import '../index.js';

        function runTest(){
            const chips = document.querySelectorAll('.chip');
            // join => exactly one chip, comma-delimited label
            if(chips.length !== 1){
                document.getElementById('target').setAttribute('mark', 'bad');
                return;
            }
            const label = chips[0].querySelector('span').textContent;
            if(label !== 'Option 1, Option 2, Option 3'){
                document.getElementById('target').setAttribute('mark', 'bad');
                return;
            }

            // its delete button clears the whole select
            chips[0].querySelector('button').click();

            setTimeout(() => {
                if(document.querySelectorAll('.chip').length === 0){
                    document.getElementById('target').setAttribute('mark', 'good');
                } else {
                    document.getElementById('target').setAttribute('mark', 'bad');
                }
            }, 500);
        }

        setTimeout(() => {
            runTest();
        }, 1000);
    </script>

    <div id="target"></div>
</body>
</html>
